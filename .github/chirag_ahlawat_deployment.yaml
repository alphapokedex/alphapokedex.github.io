// generate code for deployment of chirag_ahlawat_deployment.yaml vue website /dist folder to github pages

name: Deploy Chirag Ahlawat Website

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        uses: actions/deploy@v3
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: chiragahlawat/dist
          message: "Deploy Chirag Ahlawat Website"
