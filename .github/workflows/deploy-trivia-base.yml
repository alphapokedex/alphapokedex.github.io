name: Deploy Trivia Base to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'trivia_base/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd trivia_base
          npm ci

      - name: Build
        run: |
          cd trivia_base
          npm run build
        env:
          VITE_TRIVIA_BASE_FIREBASE_API_KEY: ${{ secrets.TRIVIA_BASE_FIREBASE_API_KEY }}
          VITE_TRIVIA_BASE_FIREBASE_AUTH_DOMAIN: ${{ secrets.TRIVIA_BASE_FIREBASE_AUTH_DOMAIN }}
          VITE_TRIVIA_BASE_FIREBASE_PROJECT_ID: ${{ secrets.TRIVIA_BASE_FIREBASE_PROJECT_ID }}
          VITE_TRIVIA_BASE_FIREBASE_STORAGE_BUCKET: ${{ secrets.TRIVIA_BASE_FIREBASE_STORAGE_BUCKET }}
          VITE_TRIVIA_BASE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TRIVIA_BASE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_TRIVIA_BASE_FIREBASE_APP_ID: ${{ secrets.TRIVIA_BASE_FIREBASE_APP_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'trivia_base/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
